<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Girlfriend's Day — Private</title>
  <style>
    :root{
      --bg:#0c1021;
      --card:#111328cc;
      --accent:#ff6b9a;
      --muted:#cbd5e1;
      --caution-yellow: #ffdd57;
      --caution-black: #111;
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
    body{
      background: radial-gradient(1200px 600px at 10% 10%, #15203a 0%, transparent 20%),
                  radial-gradient(900px 400px at 90% 90%, #221133 0%, transparent 20%),
                  var(--bg);
      display:flex;align-items:center;justify-content:center;padding:20px;color:var(--muted);
    }
    .card{
      width:100%;max-width:920px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));
      border-radius:18px;padding:26px;box-shadow:0 10px 40px rgba(2,6,23,0.6);position:relative;overflow:hidden;
      backdrop-filter: blur(6px);
      border:1px solid rgba(255,255,255,0.03);
    }
    header{display:flex;gap:16px;align-items:center;margin-bottom:14px;}
    .logo{
      width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#ffb3d0);display:flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:26px;box-shadow:0 6px 20px rgba(255,107,154,0.18);
    }
    h1{margin:0;font-size:1.4rem;color:#fff}
    p.lead{margin:4px 0 0;color:rgba(255,255,255,0.75)}
    .layout{display:grid;grid-template-columns:1fr 420px;gap:18px;align-items:stretch;}
    @media(max-width:940px){ .layout{grid-template-columns:1fr; } .preview{order:-1} }

    .left{padding:6px}
    label{font-size:0.9rem;color:var(--muted);display:block;margin-top:10px}
    input[type="text"], input[type="file"], textarea{
      width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--muted);
      outline:none;font-size:0.95rem;
    }
    .row{display:flex;gap:10px;margin-top:12px}
    button{
      background:linear-gradient(90deg,var(--accent),#ff9fc9);border:0;padding:10px 14px;border-radius:12px;color:white;font-weight:600;cursor:pointer;
      box-shadow:0 8px 18px rgba(255,107,154,0.18);
    }
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);box-shadow:none}

    /* preview */
    .preview{padding:18px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);display:flex;flex-direction:column;align-items:center;gap:14px;min-height:480px;justify-content:flex-start}
    .photo-wrap{width:260px;height:260px;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:6px solid rgba(255,255,255,0.03);background:linear-gradient(180deg,#111428,#0f1124);position:relative;}
    .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
